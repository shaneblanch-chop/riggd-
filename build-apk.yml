name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository root: $PWD"
          find . -maxdepth 4 -type f | sort

      - name: Locate Gradle project
        id: locate
        run: |
          BUILD_DIR=$(dirname "$(find . -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -n 1)")
          if [ -z "$BUILD_DIR" ] || [ "$BUILD_DIR" = "." ]; then
            BUILD_DIR="."
          fi
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project directory: $BUILD_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.build_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riggd-up-debug-apk
          path: ${{ steps.locate.outputs.build_dir }}/app/build/outputs/apk/debug/*.apk
